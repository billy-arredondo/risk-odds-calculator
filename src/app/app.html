<a class="skip-link" href="#calculator">{{ i18n.messages().skip }}</a>
<div class="page">
  <header class="masthead">
    <a class="brand" href="/" [attr.aria-label]="i18n.messages().home"
      ><span aria-hidden="true">⚄</span> RISK / ODDS</a
    >
    <span class="edition">{{ i18n.messages().edition }}</span>
    <div class="theme-switch" role="group" [attr.aria-label]="i18n.messages().theme">
      <button
        type="button"
        [attr.aria-pressed]="theme.theme() === 'light'"
        (click)="theme.setTheme('light')"
      >
        <span aria-hidden="true">☀</span> {{ i18n.messages().lightTheme }}
      </button>
      <button
        type="button"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        (click)="theme.setTheme('dark')"
      >
        <span aria-hidden="true">☾</span> {{ i18n.messages().darkTheme }}
      </button>
    </div>
    <div class="language-switch" role="group" [attr.aria-label]="i18n.messages().language">
      <button
        type="button"
        lang="en"
        [attr.aria-pressed]="i18n.language() === 'en'"
        (click)="i18n.setLanguage('en')"
      >
        English
      </button>
      <button
        type="button"
        lang="es"
        [attr.aria-pressed]="i18n.language() === 'es'"
        (click)="i18n.setLanguage('es')"
      >
        Español
      </button>
    </div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">{{ i18n.messages().tagline }}</p>
      <h1 id="page-title">
        {{ i18n.messages().title }}<br /><em>{{ i18n.messages().subtitle }}</em>
      </h1>
      <p>
        {{ i18n.messages().intro }}
      </p>
    </section>
    <div id="calculator" tabindex="-1"><router-outlet /></div>
  </main>
  <footer>
    <span>RISK / ODDS</span>
    <p>{{ i18n.messages().footer }}</p>
    <span>{{ i18n.messages().fan }}</span>
  </footer>
</div>
