<fieldset class="army" [class.attacker]="side() === 'attacker'" [class.defender]="side() === 'defender'"
  [attr.aria-label]="side() === 'attacker' ? messages().attackDice : messages().defendDice">
  <p class="side-label">
    {{ side() === 'attacker' ? messages().attackDice : messages().defendDice }}
  </p>
  <div class="dice-buttons">
    @for (option of options(); track option) {
    <button type="button" [attr.aria-label]="messages().dice(option)" [attr.aria-pressed]="count() === option"
      [class.selected]="count() === option" (click)="countChange.emit(option)">
      <span class="dice-icons" aria-hidden="true">
        @for (die of options().slice(0, option); track die) {
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="2" y="2" width="20" height="20" rx="4" />
          <circle cx="7" cy="7" r="1.5" />
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="17" cy="17" r="1.5" />
        </svg>
        }
      </span>
    </button>
    }
  </div>
  <p>
    {{
    side() === 'attacker'
    ? messages().requiresAttack(count() + 1)
    : messages().requiresDefense(count())
    }}
  </p>
</fieldset>
