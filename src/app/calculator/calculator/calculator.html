<div class="mode-switch" role="group" [attr.aria-label]="messages().mode">
  <button
    type="button"
    [class.active]="mode() === 'battle'"
    [attr.aria-pressed]="mode() === 'battle'"
    (click)="mode.set('battle')"
  >
    {{ messages().battleMode }}
  </button>
  <button
    type="button"
    [class.active]="mode() === 'roll'"
    [attr.aria-pressed]="mode() === 'roll'"
    (click)="mode.set('roll')"
  >
    {{ messages().rollMode }}
  </button>
</div>
<app-territory-battle [style.display]="mode() === 'battle' ? 'block' : 'none'" />
<app-individual-roll [style.display]="mode() === 'roll' ? 'block' : 'none'" />
<details class="method">
  <summary>{{ messages().method }}</summary>
  <div>
    <h3>{{ messages().methodTitle }}</h3>
    <p>{{ messages().methodOne }}</p>
    <p>{{ messages().methodTwo }}</p>
    <p>{{ messages().methodThree(maxArmies) }}</p>
  </div>
</details>
